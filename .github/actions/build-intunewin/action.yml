name: build-intunewin
description: Build intunewin package from app definition

inputs:
  app:
    description: Target application name
    required: true
  organization:
    description: Organization name for URL placeholder substitution (optional)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build intunewin
      shell: pwsh
      run: |
        scripts/build-intunewin.ps1 -App "${{ inputs.app }}" -Organization "${{ inputs.organization }}"
