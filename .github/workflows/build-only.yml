name: build-intunewin

on:
  workflow_dispatch:
    inputs:
      app:
        description: Target application
        required: true
        type: choice
        options:
          - chrome
          - gyazo
          - okta_verify
          - ovice
          - warp
          - zoom
      organization:
        description: 'Okta organization name (okta_verify のみ必要)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Build intunewin
        uses: ./.github/actions/build-intunewin
        with:
          app: ${{ inputs.app }}
          organization: ${{ inputs.organization }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: intunewin-${{ inputs.app }}
          path: output/
          retention-days: 3
