name: script-based-verify-apps

on:
  workflow_dispatch:
  # lint workflow が master で完走したら起動 (master へ merge → lint pass → ここが走る)。
  # workflow_run トリガーは paths: filter を持てないが、lint.yml 側のパスフィルタが
  # 効くため、apps/scripts/.github 系の変更時のみ連鎖する。
  workflow_run:
    workflows: [lint]
    branches: [master]
    types: [completed]
  # schedule:
  #   - cron: '0 0 * * *'

# 同一 ref で実行中の run があれば cancel する。matrix 全体を巻き込んで止まる。
concurrency:
  group: script-based-verify-apps-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  discover-apps:
    runs-on: ubuntu-latest
    # workflow_run 経由で来たときは lint が success の場合のみ動く。
    # workflow_dispatch / その他のイベントは無条件に動く。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      app_matrix: ${{ steps.set-matrix.outputs.app_matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Discover script_based app definitions (no input placeholders)
        id: set-matrix
        shell: pwsh
        run: |
          # script_based: true を含むYAMLを抽出（ファイル名規約に依存しない）。
          # download.url に YOUR_* プレースホルダ (例: YOUR_ORGANIZATION) が残るアプリは
          # auto matrix では入力できないため除外する (手動 workflow_dispatch では引き続き有効)。
          $apps = Get-ChildItem -Path "apps" -Filter "*.yml" | ForEach-Object {
            $def = Get-Content $_.FullName | ConvertFrom-Yaml
            if ($def.script_based -ne $true) { return }
            if ($def.download.url -and $def.download.url -match 'YOUR_[A-Z_]+') {
              Write-Host "Skipping $($_.BaseName): URL contains placeholder"
              return
            }
            $_.BaseName
          }
          $json = ConvertTo-Json -Compress @($apps)
          "app_matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  verify-matrix:
    needs: discover-apps
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover-apps.outputs.app_matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Cache IntuneWinAppUtil
        uses: actions/cache@v4
        with:
          path: IntuneWinAppUtil
          key: intunewinapputil-master-v1

      - name: Build script-based intunewin
        shell: pwsh
        run: |
          scripts/build-script-based.ps1 -App "${{ matrix.app }}"

      - name: Verify installer
        shell: pwsh
        run: |
          scripts/verify-installer.ps1 -App "${{ matrix.app }}"
        timeout-minutes: 10

      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: intunewin-${{ matrix.app }}
          path: output/
          retention-days: 3
