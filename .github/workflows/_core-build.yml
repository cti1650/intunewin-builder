name: Core Build & Verify

on:
  workflow_call:
    inputs:
      app:
        description: 'Target application name'
        required: true
        type: string
      organization:
        description: 'Organization name for URL placeholder substitution (optional)'
        required: false
        type: string
        default: ''

jobs:
  run-logic:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Build intunewin
        uses: ./.github/actions/build-intunewin
        with:
          app: ${{ inputs.app }}
          organization: ${{ inputs.organization }}

      - name: Verify installer
        uses: ./.github/actions/verify-installer
        with:
          app: ${{ inputs.app }}
        timeout-minutes: 10

      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: intunewin-${{ inputs.app }}-${{ matrix.os }}
          path: output/
          retention-days: 3