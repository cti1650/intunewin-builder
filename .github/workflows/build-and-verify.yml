name: build-and-verify-intunewin

on:
  workflow_dispatch:
    inputs:
      app:
        description: Target application
        required: true
        type: choice
        options:
          - chrome
          - gyazo
          - okta_verify
          - ovice
          - slack
          - warp
          - zoom
      organization:
        description: 'Okta organization name (okta_verify のみ必要)'
        required: false
        type: string

jobs:
  build_and_verify:
    # 共通ロジックを呼び出す
    uses: ./.github/workflows/_core-build.yml
    with:
      app: ${{ inputs.app }}
      organization: ${{ inputs.organization }}
