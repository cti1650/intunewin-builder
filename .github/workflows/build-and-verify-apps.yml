name: build-and-verify-intunewin-apps

on:
  workflow_dispatch:
  # lint workflow が master で完走したら起動 (master へ merge → lint pass → ここが走る)。
  # workflow_run トリガーは paths: filter を持てないが、lint.yml 側のパスフィルタが
  # 効くため、apps/scripts/.github 系の変更時のみ連鎖する。
  workflow_run:
    workflows: [lint]
    branches: [master]
    types: [completed]
  # schedule:
  #   - cron: '0 0 * * *'

# 同一 ref で実行中の run があれば cancel する。matrix 全体を巻き込んで止まる。
concurrency:
  group: build-and-verify-apps-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  discover-apps:
    runs-on: ubuntu-latest
    # workflow_run 経由で来たときは lint が success の場合のみ動く。
    # workflow_dispatch / その他のイベントは無条件に動く。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      app_matrix: ${{ steps.set-matrix.outputs.app_matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Install powershell-yaml
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Discover app definitions (non-script_based, no input placeholders)
        id: set-matrix
        shell: pwsh
        run: |
          # 対象から外す条件:
          # 1. ファイル名末尾が _script_based / YAML 内 script_based: true (script_based-verify-apps の管轄)
          # 2. download.url が YOUR_* プレースホルダを含む (例: okta_verify の YOUR_ORGANIZATION)
          #    手動 workflow_dispatch で Organization を渡せば動くが auto matrix では入力不能
          $apps = Get-ChildItem -Path "apps" -Filter "*.yml" | ForEach-Object {
            if ($_.BaseName -match "_script_based$") { return }
            $def = Get-Content $_.FullName | ConvertFrom-Yaml
            if ($def.script_based -eq $true) { return }
            if ($def.download.url -and $def.download.url -match 'YOUR_[A-Z_]+') {
              Write-Host "Skipping $($_.BaseName): URL contains placeholder"
              return
            }
            $_.BaseName
          }
          $json = ConvertTo-Json -Compress @($apps)
          "app_matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  run-matrix:
    needs: discover-apps
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover-apps.outputs.app_matrix) }}
    
    uses: ./.github/workflows/_core-build.yml
    with:
      app: ${{ matrix.app }}