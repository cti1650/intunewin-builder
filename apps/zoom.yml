name: zoom

download:
  url: "https://zoom.us/client/latest/ZoomInstallerFull.msi?archType=x64"
  file: ZoomInstallerFull.msi

installer:
  type: msi
  install_args: "/i {installer} /qn /norestart ZoomAutoUpdate=true"

detect:
  file: "C:\\Program Files\\Zoom\\bin\\Zoom.exe"
  version: "6.7.0.24657"
  registry_display_name: "Zoom Workplace"

uninstall:
  type: msi
  args: "/x {product_code} /qn"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  install_behavior: system
  install_command: "msiexec /i ZoomInstallerFull.msi /qn /norestart ZoomAutoUpdate=true"
  # ProductCodeはMSIのプロパティまたは検証時のレジストリから確認
  uninstall_command: 'msiexec /x "{ProductCode}" /qn'
  detection:
    type: file
    path: "C:\\Program Files\\Zoom\\bin"
    file: "Zoom.exe"