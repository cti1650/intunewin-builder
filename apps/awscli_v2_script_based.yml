name: awscli_v2_script_based

script_based: true

download:
  url: https://awscli.amazonaws.com/AWSCLIV2.msi

installer:
  type: script
  install_args: ""

detect:
  file: "C:\\Program Files\\Amazon\\AWSCLIV2\\aws.exe"
  version: "2.0"
  registry_display_name: "AWS Command Line Interface v2"

uninstall:
  type: script
  registry_name: "AWS Command Line Interface v2"

intune:
  install_behavior: system
