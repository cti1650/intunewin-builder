# NOTE: ovice は per-user installer (NSIS) で %LocalAppData%\Programs\ovice 配下に
#       インストールされる。verify-installer は Expand-EnvPath で展開して runneradmin
#       のローカルパスに解決する。Intune 配信時は install_behavior: user を選択。
name: ovice

download:
  url: https://assets.ovice.io/desktop-apps/bin/ovice-x64-latest-Setup.exe
  file: ovice-x64-latest-Setup.exe

installer:
  type: exe
  install_args: "/S"

detect:
  file: "%LocalAppData%\\Programs\\ovice\\ovice.exe"
  registry_display_name: "ovice"

uninstall:
  type: exe
  path: "%LocalAppData%\\Programs\\ovice\\Uninstall ovice.exe"
  args: "/S"

intune:
  install_behavior: user
