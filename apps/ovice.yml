# NOTE: ovice は per-user installer (NSIS) で %LocalAppData%\Programs\ovice 配下に
#       インストールされる。verify-installer は Expand-EnvPath で展開して runneradmin
#       のローカルパスに解決する。Intune 配信時は install_behavior: user を選択。
name: ovice

download:
  url: https://assets.ovice.io/desktop-apps/bin/ovice-x64-latest-Setup.exe
  file: ovice-x64-latest-Setup.exe

installer:
  type: exe
  install_args: "/S"

detect:
  file: "%LocalAppData%\\Programs\\ovice\\ovice.exe"
  # registry DisplayVersion 実値 (CI verify-installer ログで確認した値)
  version: "1.22.8"
  registry_display_name: "ovice"

uninstall:
  type: exe
  path: "%LocalAppData%\\Programs\\ovice\\Uninstall ovice.exe"
  args: "/S"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  # ユーザーコンテキストインストール (per-user)。Intune の Win32 App > Install behavior に "User" を設定。
  install_behavior: user

  # Install / Uninstall command (Intune は user-context の command で %LocalAppData% を展開する)
  install_command: "ovice-x64-latest-Setup.exe /S"
  uninstall_command: "\"%LocalAppData%\\Programs\\ovice\\Uninstall ovice.exe\" /S"

  detection:
    # Intune の File-based detection rule は %LocalAppData% を解釈しないため、
    # ユーザーコンテキスト app は Custom Detection Script を使うのが確実。
    # 以下の script を Intune UI の "Detection rules > Use a custom detection script"
    # にそのまま貼り付ける想定。
    type: custom_script
    script: |
      if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\ovice\ovice.exe')) {
          Write-Output 'Detected'
          exit 0
      }
      exit 1
