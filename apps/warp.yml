name: warp

download:
  url: https://downloads.cloudflareclient.com/v1/download/windows/ga
  file: Cloudflare_WARP_Release-x64.msi

installer:
  type: msi
  install_args: "/i {installer} /qn /norestart"

detect:
  file: "C:\\Program Files\\Cloudflare\\Cloudflare WARP\\Cloudflare WARP.exe"
  version: "2026.3.851.0"
  registry_display_name: "Cloudflare WARP"

uninstall:
  type: msi
  args: "/x {product_code} /qn"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  install_behavior: system
  install_command: "msiexec /i Cloudflare_WARP_Release-x64.msi /qn /norestart"
  # ProductCodeはMSIのプロパティまたは検証時のレジストリから確認
  uninstall_command: 'msiexec /x "{ProductCode}" /qn'
  detection:
    type: file
    path: "C:\\Program Files\\Cloudflare\\Cloudflare WARP"
    file: "Cloudflare WARP.exe"
