name: gyazo_teams_script_based

script_based: true

download:
  url: https://files.gyazo.com/setup/GyazoTeams-5.9.exe

installer:
  type: script
  install_args: "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"

detect:
  # Gyazo Teams は per-user installer (Inno Setup PrivilegesRequired=lowest)。
  # registry DisplayVersion は "5.9" (4-part でない)。
  file: "%LocalAppData%\\Programs\\Gyazo Teams\\GyazoTeams.exe"
  version: "5.9"
  registry_display_name: "Gyazo Teams"

uninstall:
  type: script
  registry_name: "Gyazo Teams"

intune:
  install_behavior: user
