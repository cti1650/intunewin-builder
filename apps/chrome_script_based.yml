name: chrome_script_based

script_based: true

download:
  url: https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi

installer:
  type: script
  install_args: ""

detect:
  file: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  # 2026-05-10 時点で x64 / ARM64 とも stable は 148.0.7778.97
  version: "148.0.7778.97"
  registry_display_name: "Google Chrome"

uninstall:
  type: script
  registry_name: "Google Chrome"

intune:
  install_behavior: system
