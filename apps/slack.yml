name: slack

download:
  url: https://slack.com/ssb/download-win64-msi
  file: slack-x64.msi

installer:
  type: msi
  install_args: "/i {installer} /qn /norestart ALLUSERS=1"

detect:
  file: "C:\\Program Files\\Slack\\slack.exe"
  version: "4.47.69.0"
  registry_display_name: "Slack"

uninstall:
  type: msi
  args: "/x {product_code} /qn"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  install_command: "msiexec /i slack-x64.msi /qn /norestart ALLUSERS=1"
  # ProductCodeはMSIのプロパティまたは検証時のレジストリから確認
  uninstall_command: 'msiexec /x "{ProductCode}" /qn'
  detection:
    type: file
    path: "C:\\Program Files\\Slack"
    file: "slack.exe"