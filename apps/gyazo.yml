name: gyazo

download:
  url: https://files.gyazo.com/setup/Gyazo-5.9.exe
  file: Gyazo-5.9.exe

installer:
  type: exe
  install_args: "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"

detect:
  file: "C:\\Program Files (x86)\\Gyazo\\GyStation.exe"
  version: "5.9.0.0"
  registry_display_name: "Gyazo"

uninstall:
  type: exe
  path: "C:\\Program Files (x86)\\Gyazo\\unins000.exe"
  args: "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  install_behavior: system
  install_command: "Gyazo-5.9.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
  uninstall_command: "\"C:\\Program Files (x86)\\Gyazo\\unins000.exe\" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
  detection:
    type: file
    path: "C:\\Program Files (x86)\\Gyazo"
    file: "GyStation.exe"
