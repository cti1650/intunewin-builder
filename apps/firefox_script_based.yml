name: firefox_script_based

script_based: true

download:
  url: https://download.mozilla.org/?product=firefox-msi-latest-ssl&os=win64&lang=ja

installer:
  type: script
  install_args: ""

detect:
  file: "C:\\Program Files\\Mozilla Firefox\\firefox.exe"
  registry_display_name: "Mozilla Firefox"

uninstall:
  type: script
  registry_name: "Mozilla Firefox"
