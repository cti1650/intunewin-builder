# NOTE: このアプリはOkta組織固有のURLを使用します。
#       ビルド時にGitHub Actionsのinputでorganization名を指定してください。
#       参考: https://zenn.dev/joug/articles/3b857a5757d8e2
name: okta_verify

download:
  url: https://YOUR_ORGANIZATION-admin.okta.com/api/v1/artifacts/WINDOWS_OKTA_VERIFY/download?releaseChannel=GA
  file: OktaVerifySetup.exe

installer:
  type: exe
  install_args: "/quiet /norestart"

detect:
  file: "C:\\Program Files\\Okta\\Okta Verify\\OktaVerify.exe"
  registry_display_name: "Okta Verify"

uninstall:
  type: registry_string
  process_name: "OktaVerify"

# ==========
# Intune Win32アプリ設定値（参照用）
# ==========
intune:
  install_command: "OktaVerifySetup.exe /quiet /norestart"
  # WiX Bootstrapper形式のためアンインストーラーパスにバージョン固有GUIDが含まれる。
  # レジストリのUninstallStringを動的に取得して実行するPowerShellコマンドを使用する。
  uninstall_command: >-
    powershell -ExecutionPolicy Bypass -Command
    "Stop-Process -Name OktaVerify -Force -ErrorAction SilentlyContinue;
    $e = Get-ItemProperty
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    -ErrorAction SilentlyContinue |
    Where-Object {$_.DisplayName -like '*Okta Verify*'} |
    Select-Object -First 1;
    if ($e) {
      $cmd = if ($e.QuietUninstallString) {$e.QuietUninstallString} else {$e.UninstallString};
      if ($cmd -match '^\"([^\"]+)\"\s*(.*)$') {Start-Process $Matches[1] -ArgumentList $Matches[2] -Wait}
    }"
  detection:
    type: file
    path: "C:\\Program Files\\Okta\\Okta Verify"
    file: "OktaVerify.exe"
